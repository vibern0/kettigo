name: Solidity quality

on:
  pull_request:
    paths:
      - "packages/contracts/**"
      - ".github/workflows/solidity-quality.yml"
      - ".prettierrc.json"
      - ".solhint.json"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    paths:
      - "packages/contracts/**"
      - ".github/workflows/solidity-quality.yml"
      - ".prettierrc.json"
      - ".solhint.json"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  solidity-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.11.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:solidity
      - run: pnpm format:solidity:check
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.19"
      - name: Compile contracts and run Slither
        id: slither
        run: pnpm contracts:analyze
      - name: Upload Slither reports
        if: ${{ !cancelled() && steps.slither.outcome != 'skipped' && hashFiles('packages/contracts/cache/slither-report.*/slither.*') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slither-report
          path: packages/contracts/cache/slither-report.*/slither.*
          if-no-files-found: error
