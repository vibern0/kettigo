name: Solidity quality

on:
  pull_request:
    paths:
      - "packages/contracts/**"
      - ".github/workflows/solidity-quality.yml"
      - ".prettierrc.json"
      - ".solhint.json"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    paths:
      - "packages/contracts/**"
      - ".github/workflows/solidity-quality.yml"
      - ".prettierrc.json"
      - ".solhint.json"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  solidity-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.11.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:compile
      - run: pnpm lint:solidity
      - run: pnpm format:solidity:check
      - name: Run Aderyn
        run: |
          mkdir -p aderyn-report
          pnpm exec aderyn packages/contracts --output aderyn-report/aderyn.md
          pnpm exec aderyn packages/contracts --output aderyn-report/aderyn.sarif
          pnpm exec aderyn packages/contracts --output aderyn-report/aderyn.json
      - name: Enforce reviewed Aderyn findings
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const report = JSON.parse(readFileSync("aderyn-report/aderyn.json", "utf8"));
          const findings = Object.entries(report.issue_count ?? {}).filter(([, count]) => count > 0);

          if (findings.length > 0) {
            console.error(`Aderyn findings require remediation or a reviewed suppression: ${findings.map(([severity, count]) => `${severity}=${count}`).join(", ")}`);
            process.exit(1);
          }
          NODE
      - name: Upload Aderyn report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aderyn-report
          path: aderyn-report/
          if-no-files-found: error
